# Build the addin for MPC OS and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/ADDINS.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below, the same
# one as in test.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip, addin.manifest and INSTALL.md, e.g. 0.3.0
        required: true
        type: string
      dry_run:
        description: Build and package only (the zip as a run artifact, no draft release)
        type: boolean
        default: false

jobs:
  addin:
    uses: sd88me/mpc-vst-plugins/.github/workflows/addin-release.yml@a4b8f861d07153a2b387d7520331f532f7247502
    permissions: { contents: write }
    with:
      tag: remote-addin-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: a4b8f861d07153a2b387d7520331f532f7247502
      package_dir: build
      build: ./build.sh
      host_test: sudo sysctl -q vm.mmap_rnd_bits=28 && python3 -m pip install --quiet mcp && tests/test.sh
      about: "The MPC screen in a browser, and an MCP server so an AI model can see and touch it, play MIDI and read files."
      license: MIT
      dry_run: ${{ inputs.dry_run }}
