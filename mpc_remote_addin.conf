# mpc-preload-addin-remote settings (key=value; this file sits next to mpc_remote_addin.so)
# enabled=0 leaves the add-in loaded but idle.
enabled=1
# Listen address and port. 0.0.0.0 is every network interface: anyone on the network can see and touch the screen.
bind=0.0.0.0
port=8080
# The touchscreen: auto (the first on-screen multitouch device that isn't virtual) or /dev/input/eventN.
touch_device=auto
# How the touch panel sits against the screen: 0, 90, 180 or 270. 90 is right for the MPC Key 37.
touch_rotate=90
# Stream frame-rate cap, connections at once, and the add-in threads' nice value (0..19, higher is gentler).
max_fps=10
max_clients=6
nice=10
