# mpc-addin-remote settings (key=value; this file sits next to mpc_remote_addin.so)
# enabled=0 leaves the addin loaded but idle.
enabled=1
# Listen address and port. 0.0.0.0 is every network interface: anyone on the network can see and touch the screen.
bind=0.0.0.0
port=8080
# The touchscreen: auto (the first on-screen multitouch device that isn't virtual) or /dev/input/eventN.
touch_device=auto
# The clockwise turn that shows the scanout upright: auto (a portrait scanout turns 90), 0, 90, 180 or 270.
# The MPC Key 37's panel is 800 x 1280 with the UI drawn into it on its side: auto is right for it.
screen_rotate=auto
# How the touch panel's axes sit against the scanout: 0, 90, 180 or 270 (0 when they are the same panel).
touch_rotate=0
# Stream frame-rate cap, connections at once, and the addin threads' nice value (0..19, higher is gentler).
max_fps=10
max_clients=6
nice=10
# The MCP endpoint for AI models (/mcp): 1 on, 0 off. There is no login, like the rest of the server.
mcp=1
# The folders MCP's file tools may read (read-only): comma-separated absolute paths, or none.
mcp_files=/media,/sdcard,/data/mpc-addins
